name: Deploy to Kanzume
description: wrangler の設定のまま Kanzume にデプロイする
branding:
  icon: upload-cloud
  color: orange
inputs:
  url:
    description: Kanzume の URL（管理画面やサイトの URL）
    required: true
  token:
    description: 個人トークン（管理画面の「設定 > トークン」で発行したもの）
    required: true
  site:
    description: デプロイ先のサイトの名前（先に管理画面でサイトを追加しておく。wrangler の name は使わない）
    required: true
  working-directory:
    description: wrangler.jsonc / wrangler.toml があるディレクトリ
    required: false
    default: "."
outputs:
  url:
    description: デプロイ先の URL
    value: ${{ steps.deploy.outputs.url }}
runs:
  using: composite
  steps:
    - id: deploy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/deploy.mjs"
      env:
        KANZUME_URL: ${{ inputs.url }}
        KANZUME_TOKEN: ${{ inputs.token }}
        KANZUME_SITE: ${{ inputs.site }}
