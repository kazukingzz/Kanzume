name: Deploy example to Kanzume

on:
  push:
    branches: [main]
    paths:
      - examples/worker/**
      - action/**
      - .github/workflows/deploy-example.yml
  workflow_dispatch:

concurrency:
  group: deploy-example
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [worker]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: kanzume
        uses: ./action
        with:
          url: ${{ vars.KANZUME_URL }}
          token: ${{ secrets.KANZUME_TOKEN }}
          working-directory: examples/${{ matrix.example }}

      - run: echo "デプロイしました：${{ steps.kanzume.outputs.url }}"
