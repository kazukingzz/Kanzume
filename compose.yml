services:
  kanzume:
    build: .
    image: kanzume
    restart: unless-stopped
    ports:
      - "${KANZUME_PORT:-8080}:8080"
    volumes:
      - kanzume-data:/data
    # .env の値はすべてコンテナに渡す（KANZUME_MAX_UPLOAD_MB などほかの設定も、.env に書けば効く）
    env_file:
      - path: .env
        required: false
    environment:
      # ルートドメインの URL（例: https://example.com）。未設定なら管理画面で設定したドメイン（それもなければアクセスされたドメイン）を使う
      KANZUME_ORIGIN: ${KANZUME_ORIGIN:-}
      # 最初のパスキー登録に使う。未設定なら起動ログに出る
      KANZUME_SETUP_TOKEN: ${KANZUME_SETUP_TOKEN:-}
      # バックアップ先（例: s3://<KEY>:<SECRET>@<ACCOUNT_ID>.r2.cloudflarestorage.com/<BUCKET>）。未設定ならバックアップしない
      KANZUME_BACKUP_URL: ${KANZUME_BACKUP_URL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/_health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  kanzume-data:
